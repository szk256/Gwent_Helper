<style>
:root{--night:#18202E;--night2:#222C3E;--line:#34405A;--parch:#E6DBC1;--parch2:#F3ECDA;--edge:#BFAF8C;--ink:#2B2419;--ink2:#6B5E47;--gold:#C9A24A;--dim:#8E97AB;--txt:#E9ECF2;

*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--txt);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
header h1{font-size:24px;color:var(--gold);letter-spacing:.04em}
header small{color:var(--dim)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--night2);border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:13px 0;font:inherit;font-size:14px}
nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.sheet{background:var(--parch);color:var(--ink);border-radius:4px;padding:14px;margin-bottom:12px}
.sheet h2{font-size:17px;margin-bottom:8px}
.row{margin:12px 0}
.lab{font-size:13px;color:var(--ink2);margin-bottom:5px}
select,textarea,input{width:100%;font:inherit;padding:8px;border:1px solid var(--edge);border-radius:3px;background:var(--parch2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--edge);background:var(--parch2);color:var(--ink);border-radius:3px;padding:6px 10px;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--parch);border-color:var(--ink)}
.fac{border-left:5px solid var(--c)}
.fac.on{background:var(--c);border-color:var(--c);color:#fff}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--edge);background:var(--parch2);border-radius:3px;font:inherit;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--parch)}
.seg button.W.on{background:var(--win);border-color:var(--win)}
.seg button.L.on{background:var(--loss);border-color:var(--loss)}
.seg button.D.on{background:var(--draw);border-color:var(--draw)}
.step{display:flex;align-items:center;gap:12px}

.step output{font-size:24px;font-family:"Noto Serif SC",serif;min-width:44px;text-align:center}
.primary{width:100%;padding:12px;background:var(--gold);color:#241B08;border:0;border-radius:3px;font:inherit;font-weight:700;font-size:16px}
.ghost{background:none;border:1px solid var(--line);color:var(--txt);padding:7px 11px;border-radius:3px;font:inherit;font-size:14px}
.sheet .ghost{border-color:var(--edge);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--dim);font-size:13px}
.sheet .note{color:var(--ink2)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cmp select{background:var(--night2);color:#fff;border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid #CDBF9F}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--ink2);font-size:13px}
.big{font-family:"Noto Serif SC",serif;font-size:32px;color:var(--gold);line-height:1}
.hero{display:flex;gap:18px;margin:4px 0 14px;flex-wrap:wrap}
.hero span{display:block;color:var(--dim);font-size:13px;margin-top:4px}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sheet .item{border-color:#CDBF9F}
.item .meta{flex:1;font-size:13px;color:var(--dim);min-width:0}
.sheet .item .meta{color:var(--ink2)}

.sheet .item .meta b{color:var(--ink)}
.gems{display:flex;gap:3px}

.x{background:none;border:0;color:var(--dim);font-size:18px;padding:4px 8px}
.cnt{min-width:46px;padding:6px 0;border:1px solid var(--edge);border-radius:3px;background:var(--parch2);font:inherit;color:var(--ink)}
.cnt.has{background:var(--ink);color:var(--parch)}
.tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:2px;background:var(--c,#999);color:#fff;margin-right:4px;vertical-align:1px}
.gold{--c:#A8862F}.bronze{--c:#8A5A3B}
.results{margin-top:6px;max-height:320px;overflow:auto}
.res{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px;border:0;border-bottom:1px solid #D6C9AA;background:none;font:inherit;color:var(--ink)}
.res small{color:var(--ink2)}
.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.acts button{padding:10px 0;border:1px solid var(--edge);background:var(--parch2);border-radius:3px;font:inherit;font-size:14px;color:var(--ink)}
.acts button.on{background:var(--ink);color:var(--parch)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.who button{padding:11px 0;border:2px solid var(--edge);background:var(--parch2);border-radius:3px;font:inherit;font-weight:700;color:var(--ink)}
.who button.me.on{background:var(--NR);border-color:var(--NR);color:#fff}
.who button.op.on{background:var(--loss);border-color:var(--loss);color:#fff}
.log{font-size:14px;margin-top:8px}
.board{display:grid;gap:4px;margin-top:6px}
.brow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border-radius:3px;min-height:38px}
.brow.op{background:rgba(180,71,60,.12)}.brow.me{background:rgba(62,99,184,.12)}
.brow.me:nth-child(3){border-top:2px solid var(--ink2)}
.bl{font-size:12px;color:var(--ink2);min-width:58px}
.chip.bm{border-color:var(--NR)}.chip.bo{border-color:var(--loss)}
.fxtag{font-size:12px;background:#5B6B86;color:#fff;border-radius:2px;padding:1px 6px}
details summary{cursor:pointer}
.board [data-u]{touch-action:none;cursor:grab}
.board [data-u].dragging{pointer-events:none;opacity:.85;box-shadow:0 6px 14px rgba(0,0,0,.35);z-index:5;position:relative;cursor:grabbing}
.brow.drop{outline:2px dashed var(--gold);outline-offset:-2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px}
.tile{position:relative;aspect-ratio:3/4;border:2px solid #8A5A3B;border-radius:4px;background:#3a3122;overflow:hidden;padding:0;font:inherit;color:#fff;text-align:left}
.tile.g{border-color:#C9A24A}.tile.l{border-color:#7FA6D8}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:12px;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.85));text-shadow:0 1px 2px #000}
.tile .pv{position:absolute;right:3px;top:3px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;background:#2B2419;border:1px solid #C9A24A;transform:rotate(45deg)}
.tile .pv{transform:none;border-radius:50%}
.tile .pw{position:absolute;left:3px;top:3px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;font-weight:700;background:#1c2433;border:1px solid #ccc;border-radius:3px}
.tile .ar{position:absolute;left:3px;top:28px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;background:#555;border-radius:50% 50% 45% 45%}
.tile .bd{position:absolute;right:3px;bottom:34px;font-size:11px;background:rgba(201,162,74,.95);color:#241B08;border-radius:2px;padding:0 4px}
.tile.gone{filter:grayscale(1);opacity:.45}
.tile.edited .nm::after{content:" ✎"}
.gl{margin-top:10px}
.rtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rtabs button{border:1px solid var(--edge);background:var(--parch2);border-radius:3px;padding:6px 10px;font:inherit;font-size:14px;color:var(--ink)}
.rtabs button.on{background:var(--ink);color:var(--parch)}
.log .le{background:none;border:0;text-align:left;font:inherit;color:inherit;width:100%;padding:2px 0;cursor:pointer}
.log div.ins{outline:2px dashed var(--gold)}
.ebtns{display:flex;flex-wrap:wrap;gap:6px}
.ghost.bad{color:var(--loss);border-color:var(--loss)}
.upw{margin-left:4px;opacity:.7}
.item .art{margin-right:8px}
.slot{border:1px dashed var(--ink2);background:transparent;color:var(--ink2);border-radius:3px;min-width:30px;padding:6px 4px;font:inherit}
.slot:hover{background:var(--gold);color:#241B08}
.chip.dim{opacity:.75;cursor:default}
.res{align-items:center}
.res .rn{flex:1}
.art{width:34px;height:46px;object-fit:cover;border-radius:2px;flex:none;box-shadow:0 0 0 1px #8a7650}
.res.gone{opacity:.45}
.results.tall{max-height:52vh}
.flow{outline:2px solid var(--gold);outline-offset:-2px}
.bl.rowpick{border:1px dashed var(--ink2);background:transparent;border-radius:3px;padding:4px 6px;font:inherit;font-size:12px;color:var(--ink2)}
.bl.rowpick.on{background:var(--ink);color:var(--parch)}
.log div.me{border-left:3px solid var(--NR);padding-left:6px}
.log div.op{border-left:3px solid var(--loss);padding-left:6px}
.log div{display:flex;align-items:center;padding:4px 0;border-bottom:1px dashed #CDBF9F}
.log div span{flex:1}
.log .m{color:var(--NR);font-weight:600}.log .o{color:var(--loss);font-weight:600}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0}
.sum b{font-family:"Noto Serif SC",serif;font-size:18px}
.bad{color:var(--loss)}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--gold);color:#241B08;padding:8px 16px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
dialog{border:0;border-radius:4px;background:var(--parch);color:var(--ink);width:min(92vw,600px);padding:14px}
dialog textarea{height:50vh;font-size:13px}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

html{background:#150e09}body{min-height:100vh}
:root{--wood:#1d140d;--wood2:#2a1d12;--wood3:#3a2819;--parch:#E9DDBF;--parch2:#F4EAD2;--edge:#B59E6E;--ink:#2A1F12;--ink2:#6E5C3E;
  --gold:#D4AF5A;--gold2:#8C6A26;--dim:#A99A80;--txt:#EFE6D2;--line:#4A3624;--mine:var(--NR);--theirs:var(--MO)}
body{background:
  radial-gradient(ellipse at 50% -10%,rgba(212,175,90,.10),transparent 55%),

header{align-items:center;padding:4px 2px 10px;border-bottom:1px solid rgba(212,175,90,.25);margin-bottom:14px}

header h1::before{content:"";width:14px;height:14px;transform:rotate(45deg);background:linear-gradient(135deg,#F7E3A6,#8C6A26);box-shadow:0 0 0 2px #2a1d12,0 0 0 3px #D4AF5A}
header small{color:var(--dim);font-family:"Noto Serif SC","Songti SC",serif}

.sheet{background:radial-gradient(ellipse at 30% 0,#F7EEDA,transparent 70%),linear-gradient(180deg,#EADFC3,#E0D2AF);border-radius:3px;
  box-shadow:inset 0 0 0 1px #9C8455,inset 0 0 0 4px #EFE4C8,inset 0 0 0 5px #C6AE7B,0 6px 16px rgba(0,0,0,.45);padding:16px}

.board{gap:0;margin-top:8px;padding:6px;border-radius:4px;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 14px),linear-gradient(180deg,#3b2a1a,#241810);

.brow.me{background:linear-gradient(90deg,color-mix(in srgb,var(--mine) 22%,transparent),transparent 70%)}
.brow.op+.brow.me{border-top:2px solid var(--gold);box-shadow:0 -1px 8px rgba(212,175,90,.35)}

}
/* ---------- card tiles ---------- */
.tile{border-radius:5px;border:2px solid #7a5334;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.45);background:#2b2116;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile.g{border-color:#D4AF5A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(212,175,90,.45),0 3px 8px rgba(0,0,0,.45)}
.tile.l{border-color:#8FB4E6}
.tile .pw{left:4px;top:4px;width:26px;height:26px;min-width:0;border-radius:0;transform:rotate(45deg);background:linear-gradient(135deg,#3a3a3a,#0f0f0f);border:1px solid #D4AF5A}
.tile .pw i{transform:rotate(-45deg);font-style:normal;font-size:13px;font-weight:700}
.tile .pv{right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3D98E,#9C7630);color:#2A1C08;border:1px solid #5a4219}
.tile .ar{left:6px;top:36px;background:linear-gradient(180deg,#b9b9b9,#6c6c6c);color:#111;border-radius:40% 40% 50% 50%;font-weight:700}
.tile .bd{background:linear-gradient(180deg,#F3D98E,#C49B45);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.tile .nm{font-family:"Noto Serif SC","Songti SC",serif}
/* ---------- log timeline ---------- */
.log{position:relative;padding:4px 0}
.log::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(transparent,#9C8455 10%,#9C8455 90%,transparent)}
.log div{border:0;padding:3px 0;position:relative}
.log div.me{border-left:0;padding-left:0;justify-content:flex-start;padding-right:52%}
.log div.op{border-left:0;padding-left:52%;justify-content:flex-end;text-align:right}
.log div .le,.log div > span{border-radius:4px;padding:5px 8px;font-size:13px;line-height:1.35}
.log div.me .le,.log div.me > span{background:color-mix(in srgb,var(--mine) 14%,#F6EDD7);border-left:3px solid var(--mine)}
.log div.op .le,.log div.op > span{background:color-mix(in srgb,var(--theirs) 14%,#F6EDD7);border-right:3px solid var(--theirs);text-align:right}
.log div.me::after,.log div.op::after{content:"";position:absolute;left:calc(50% - 4px);top:50%;width:7px;height:7px;transform:translateY(-50%) rotate(45deg);background:#9C8455}
.log div.ins{outline:none}.log div.ins::before{content:"▼ 插在这里";position:absolute;left:0;right:0;top:-2px;height:2px;background:var(--gold);font-size:11px;color:var(--gold2);line-height:0}
/* ---------- round gems / results ---------- */
.gem{width:12px;height:12px;border:1px solid rgba(0,0,0,.5);box-shadow:0 0 6px var(--c)}
.sum b{color:#3A2A15}
.big{background:linear-gradient(180deg,#F7E3A6,#D4AF5A 60%,#8C6A26);-webkit-background-clip:text;background-clip:text;color:transparent}
.item{border-color:rgba(212,175,90,.18)}
.flow{outline:none;box-shadow:inset 0 0 0 1px #9C8455,inset 0 0 0 4px #EFE4C8,inset 0 0 0 5px var(--gold),0 0 0 2px var(--gold),0 0 22px rgba(212,175,90,.45)}
.toast{background:linear-gradient(180deg,#F3D98E,#C49B45);border:1px solid #6E5220;box-shadow:0 6px 16px rgba(0,0,0,.5);font-family:"Noto Serif SC","Songti SC",serif}
dialog{box-shadow:0 0 0 1px #9C8455,0 20px 50px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(10,6,3,.7)}
table th{color:#6E5C3E}
.cmp select{background:#2a1d12;border-color:#5b4128;color:var(--txt)}
@media (prefers-reduced-motion:reduce){.tile,.chip.unit{transition:none}.tile:hover{transform:none}}
.chip.unit .upw.up{color:#7CE07C;border-color:#7CE07C}.chip.unit .upw.dn{color:#FF7A6B;border-color:#FF7A6B}.chip.unit .ust{z-index:2}.chip.unit .uar,.chip.unit .unm{z-index:2}
.uar{position:absolute;right:2px;top:2px;min-width:16px;height:16px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:#556;border:1px solid #aab;border-radius:3px}
.unm{position:absolute;right:2px;top:20px;width:16px;height:16px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#111;background:#FFD24A;border-radius:50%}
.uord{position:absolute;right:2px;top:38px;z-index:3;width:16px;height:16px;display:grid;place-items:center;font-size:10px;font-weight:700;border-radius:3px;color:#241B08;background:var(--gold);border:1px solid #241B08}
.uord.wait{color:#E8E0CC;background:rgba(0,0,0,.72);border:1px dashed #BFB59C}
.ust{position:absolute;left:0;right:0;top:26px;font-size:9px;text-align:center;color:#fff;background:rgba(0,0,0,.6);line-height:12px}
.rsum{align-self:center;min-width:26px;margin-right:4px;text-align:center;font-weight:700;color:#D9C28D}
.eng .score{display:flex;align-items:baseline;gap:6px;font-size:22px}.eng .sm{color:var(--mine)}.eng .so{color:var(--theirs)}
.eng .warn{font-size:12px;margin:4px 0;display:flex;gap:6px;align-items:center}

/* ===================== 暗色主题 =====================
 * 面板深色、文字浅色；按钮一律是“有底色 + 边框”的块，和正文文字区分开；
 * 选中状态用金色底 + 深色字；主按钮金色。文字对比度都在 4.5:1 以上。 */
:root{color-scheme:dark;--night:#150e09;--night2:#2a1d12;
  --parch:#241b13;--parch2:#30251a;--edge:#5e4a33;--ink:#EDE3CD;--ink2:#BBAA8C;--dim:#A3937A;--txt:#EDE3CD;--line:#4A3624;
  --btn:#3a2d20;--btn2:#2f2419;--btnEdge:#76603f;--on1:#E6C470;--on2:#B98F3E;--onInk:#1d140d;--field:#18120c;
  --sheetLine:#5a4630;--rule:#3f3122;--bad:#EC8577}
.sheet{background:linear-gradient(180deg,#2a2017,#211811);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--sheetLine),inset 0 0 0 4px #251c14,inset 0 0 0 5px #3b2e20,0 6px 16px rgba(0,0,0,.55)}
.sheet h2,.clock b,.sum b{color:#F2DFA9}
.sheet h2::after{background:linear-gradient(90deg,#8C6A26,transparent)}
.lab,.sheet .note,table th,.res small,.item .meta,.sheet .item .meta{color:var(--ink2)}
.sheet .item .meta b,.res{color:var(--ink)}
select,textarea,input{background:var(--field);color:var(--ink);border-color:var(--edge)}
input::placeholder,textarea::placeholder{color:#8a7b64}
/* 按钮：统一的凸起块 */
.chip,.seg button,.acts button,.rtabs button,.step button,.cnt,.who button,.ghost,.sheet .ghost,.x{
  background:linear-gradient(180deg,var(--btn),var(--btn2));color:var(--ink);border:1px solid var(--btnEdge);box-shadow:0 1px 0 rgba(0,0,0,.4);cursor:pointer}
.chip:hover,.seg button:hover,.acts button:hover,.rtabs button:hover,.step button:hover,.cnt:hover,.who button:hover,.ghost:hover{border-color:var(--on1)}
.chip.on,.seg button.on,.acts button.on,.rtabs button.on,.cnt.has,.bl.rowpick.on{
  background:linear-gradient(180deg,var(--on1),var(--on2));color:var(--onInk);border-color:var(--on1);text-shadow:none}
.ghost.bad,.sheet .ghost.bad{color:var(--bad);border-color:#9a4a3f}
.bad,.clock b.bad{color:var(--bad)}
.chip.fac.on{background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));color:#fff;border-color:var(--c)}
.seg button.W.on,.seg button.L.on,.seg button.D.on{color:#fff}
.x{border-color:transparent;background:none;box-shadow:none;color:var(--dim)}
.x:hover{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
/* 细线 */
th,td,.res,.sheet .item{border-color:var(--rule)}
.log div{border-color:var(--rule)}
.log::before{background:linear-gradient(transparent,#76603f 10%,#76603f 90%,transparent)}
.log div.me::after,.log div.op::after{background:#76603f}
.log div.me .le,.log div.me > span{background:color-mix(in srgb,var(--mine) 26%,#241b13);color:var(--ink)}
.log div.op .le,.log div.op > span{background:color-mix(in srgb,var(--theirs) 26%,#241b13);color:var(--ink)}
.log .le:hover{filter:brightness(1.15)}
.eng .sm{color:color-mix(in srgb,var(--mine) 55%,#fff)}.eng .so{color:color-mix(in srgb,var(--theirs) 55%,#fff)}
.flow{box-shadow:inset 0 0 0 1px var(--sheetLine),0 0 0 2px var(--gold),0 0 22px rgba(212,175,90,.35)}
dialog{background:#241b13;color:var(--ink);box-shadow:0 0 0 1px #76603f,0 20px 50px rgba(0,0,0,.8)}
.slot{color:#E6C470}
.tag{color:#fff}

/* 电脑宽屏：左边栏导航 + 两栏内容 */
.pcOnly,.brand,.navdata{display:none}
@media (min-width:1100px){
  nav{top:0;right:auto;width:200px;flex-direction:column;align-items:stretch;border-top:0;border-right:2px solid var(--gold2);
    box-shadow:6px 0 18px rgba(0,0,0,.5);background:linear-gradient(90deg,#1a110a,#2c1e13);padding:18px 12px;gap:4px}
  nav .brand{display:block;font:700 22px "Noto Serif SC","Songti SC",serif;letter-spacing:.12em;color:#E6C470;padding:4px 8px 16px;border-bottom:1px solid rgba(212,175,90,.25);margin-bottom:10px}
  nav button[data-t]{flex:none;text-align:left;padding:11px 14px;border-radius:3px;font-size:16px}
  nav button[data-t].on{box-shadow:inset 3px 0 0 var(--gold);background:radial-gradient(ellipse at 0 50%,rgba(212,175,90,.22),transparent 80%)}
  nav .navdata{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid rgba(212,175,90,.25)}
  nav .navlab{font-size:12px;color:var(--dim);padding:0 4px}
  nav .navdata button{flex:none;text-align:left;padding:8px 10px;font-size:14px;letter-spacing:0;color:var(--ink);
    background:linear-gradient(180deg,var(--btn),var(--btn2));border:1px solid var(--btnEdge);border-radius:3px}
  nav .navdata button:hover{border-color:var(--on1)}
  body{padding-left:200px}
  header h1{display:none}
  .wrap{max-width:1320px;padding-bottom:32px}
  .toast{bottom:24px;left:calc(50% + 100px)}
  .duo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 16px;align-items:start}
  .duo.coll{grid-template-columns:300px minmax(0,1fr)}
  .duo>.colL{position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto}
  .pcOnly{display:block}
  .mbOnly{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
}
/* 记录里的“第几手 · 比分 · 时间”和偏差报告 */
.log .lmeta{display:block;font-size:11px;opacity:.75;margin-bottom:1px}
.dev{display:flex;flex-direction:column;gap:4px;margin:6px 0;font-size:13px}
.dev>div{padding:5px 8px;border-radius:6px;background:var(--field,rgba(255,255,255,.05));border-left:3px solid transparent}
.dev>div.ok{border-left-color:#4caf50}.dev>div.bad{border-left-color:#e05a4f}
.dev.steps>div.me{border-left-color:var(--NR)}.dev.steps>div.op{border-left-color:var(--loss)}
.dev small{opacity:.8}.dev .fl{color:var(--gold)}
details.sheet>summary{cursor:pointer}
#bkInfo{margin-top:6px}#bkInfo.bad{color:#e8806f}
input.vt{width:108px;padding:6px 8px;font-size:13px}
/* 键盘选中的搜牌结果 */
#resBox .kb{outline:2px solid var(--gold);outline-offset:2px}
#verInfo{font-size:11px;opacity:.7;margin-top:2px}

/* ===================== 可切换主题（html[data-theme]，默认“经典”不设属性） =====================
 * 每套主题只换变量；下面的覆盖规则对所有非经典主题通用。对比度都 ≥ 5.6:1（正文、次要文字、选中按钮文字）。
 * 极简黑按 mini LED 调：不用纯黑、不用纯白字、去掉发光，减少分区背光的光晕。 */
html[data-theme="slate"]{--bg0:#0f1318;--bg:linear-gradient(180deg,#161b22,#0f1318);--panel:#1c222b;--panel2:#181d25;--navBg:linear-gradient(180deg,#1a2029,#12161c);--navOn:rgba(217,180,90,.14);
  --ink:#E6EAF0;--ink2:#AAB4C2;--dim:#939DAC;--txt:#E6EAF0;--edge:#465163;--line:#333c4a;--btn:#262d38;--btn2:#212731;--btnEdge:#465163;
  --on1:#E3C26E;--on2:#C29B45;--onInk:#12161c;--field:#11151b;--sheetLine:#333c4a;--rule:#2a323d;--gold:#D9B45A;--gold2:#8D7132;--h2:#F0D9A0;
  --glowA:rgba(217,180,90,.35);--boardBg:#141920;--unitEdge:#4d5869;--lab:#C7CFDA;--bad:#F08A7E;--night:#0f1318;--night2:#1c222b;--parch:#1c222b;--parch2:#262d38}
html[data-theme="table"]{--bg0:#0b1a13;--bg:radial-gradient(ellipse at 50% 15%,#1d3d2e 0,#10261b 55%,#0b1a13 100%);--panel:#2b1f15;--panel2:#241a11;--navBg:linear-gradient(180deg,#2c1e13,#1a110a);--navOn:rgba(217,174,92,.18);
  --ink:#EEE4CF;--ink2:#C2B394;--dim:#A89878;--txt:#EEE4CF;--edge:#8a6a3c;--line:#45331f;--btn:#3a2c1e;--btn2:#2f2418;--btnEdge:#8a6a3c;
  --on1:#E4BA6A;--on2:#B8893A;--onInk:#1a120b;--field:#1a130c;--sheetLine:#6b4f2e;--rule:#45331f;--gold:#D9AE5C;--gold2:#8f6a2b;--h2:#F4DDA4;
  --glowA:rgba(217,174,92,.35);--boardBg:radial-gradient(ellipse at 50% 50%,#1f4a34,#12301f);--unitEdge:#8a6a3c;--lab:#E3D2A2;--bad:#F08A7E;--night:#0b1a13;--night2:#2b1f15;--parch:#2b1f15;--parch2:#3a2c1e}
html[data-theme="black"]{--bg0:#0b0d11;--bg:#0b0d11;--panel:#14171c;--panel2:#111418;--navBg:#0e1014;--navOn:rgba(210,174,92,.10);
  --ink:#E2E4E8;--ink2:#A6ABB4;--dim:#8D939C;--txt:#E2E4E8;--edge:#353b45;--line:#262a31;--btn:#1b1f25;--btn2:#171a1f;--btnEdge:#353b45;
  --on1:#D9B460;--on2:#B8923F;--onInk:#0b0d11;--field:#0e1014;--sheetLine:#262a31;--rule:#20242a;--gold:#D2AE5C;--gold2:#6f5a2c;--h2:#EDE0BD;
  --glowA:transparent;--boardBg:#0f1216;--unitEdge:#3a414c;--lab:#C3C8D0;--bad:#EE8579;--night:#0b0d11;--night2:#14171c;--parch:#14171c;--parch2:#1b1f25}
html[data-theme="navy"]{--bg0:#081021;--bg:linear-gradient(180deg,#0d1a33,#081021);--panel:#122041;--panel2:#0f1b37;--navBg:linear-gradient(180deg,#0c1730,#0a1328);--navOn:rgba(92,200,238,.14);
  --ink:#E4ECF7;--ink2:#A6B8D0;--dim:#8FA3BF;--txt:#E4ECF7;--edge:#33558c;--line:#274372;--btn:#182a52;--btn2:#152448;--btnEdge:#33558c;
  --on1:#F2B650;--on2:#C98C2C;--onInk:#0a1224;--field:#0a1530;--sheetLine:#274372;--rule:#1c2f55;--gold:#5CC8EE;--gold2:#2c7fa6;--h2:#9EE3FA;
  --glowA:rgba(92,200,238,.35);--boardBg:#0c1832;--unitEdge:#3a5c94;--lab:#B6CCE6;--bad:#FF8C7F;--night:#081021;--night2:#122041;--parch:#122041;--parch2:#182a52}
/* 纯黑：背景 #000，文字降亮度（不用白），强调色也调暗，整体最不刺眼 */
html[data-theme="pure"]{--bg0:#000;--bg:#000;--panel:#000;--panel2:#000;--navBg:#000;--navOn:rgba(190,160,100,.10);
  --ink:#C9CDD3;--ink2:#9095A0;--dim:#80858F;--txt:#C9CDD3;--edge:#2a2e35;--line:#1c1f24;--btn:#0d0f12;--btn2:#0a0b0e;--btnEdge:#2a2e35;
  --on1:#B89A5A;--on2:#9A7F45;--onInk:#000;--field:#050607;--sheetLine:#1c1f24;--rule:#15171b;--gold:#B39556;--gold2:#5c4c2c;--h2:#D8C9A4;
  --glowA:transparent;--boardBg:#000;--unitEdge:#2e333b;--lab:#A9AEB6;--bad:#D9776C;--night:#000;--night2:#000;--parch:#000;--parch2:#0d0f12}
html[data-theme="pure"] *{text-shadow:none!important}
html[data-theme="pure"] .chip.unit,html[data-theme="pure"] .tile,html[data-theme="pure"] .sheet{box-shadow:inset 0 0 0 1px var(--sheetLine)}
html[data-theme="pure"] .fxtag{box-shadow:none}
html[data-theme="pure"] .who button.on,html[data-theme="pure"] .chip.fac.on{filter:brightness(.75)}
html[data-theme="pure"] .chip.unit img,html[data-theme="pure"] .tile img{filter:brightness(.8)}
html[data-theme]{background:var(--bg0)}
html[data-theme] body{background:var(--bg);background-attachment:fixed;color:var(--txt)}
html[data-theme] header{border-bottom-color:var(--rule)}
html[data-theme] header h1,html[data-theme] .big{background:none;-webkit-text-fill-color:currentColor;color:var(--h2)}
html[data-theme] header h1::before{background:var(--gold);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--gold)}
html[data-theme] nav{background:var(--navBg);border-color:var(--gold2)}
html[data-theme] nav button.on{color:var(--h2);box-shadow:inset 0 3px 0 var(--gold);background:var(--navOn)}
@media (min-width:1100px){
  html[data-theme] nav{background:var(--navBg)}
  html[data-theme] nav .brand{color:var(--h2);border-bottom-color:var(--rule)}
  html[data-theme] nav button[data-t].on{box-shadow:inset 3px 0 0 var(--gold);background:var(--navOn)}
  html[data-theme] nav .navdata{border-top-color:var(--rule)}
}
html[data-theme] .sheet{background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:inset 0 0 0 1px var(--sheetLine),0 6px 16px rgba(0,0,0,.5)}
html[data-theme] .sheet h2,html[data-theme] .clock b,html[data-theme] .sum b{color:var(--h2)}
html[data-theme] .sheet h2::after{background:linear-gradient(90deg,var(--gold2),transparent)}
html[data-theme] input::placeholder,html[data-theme] textarea::placeholder{color:var(--dim)}
html[data-theme] .primary{background:linear-gradient(180deg,var(--on1),var(--on2));color:var(--onInk);border-color:var(--on2);box-shadow:0 2px 0 rgba(0,0,0,.4);text-shadow:none}
html[data-theme] .board{background:var(--boardBg);box-shadow:inset 0 0 0 1px var(--sheetLine)}
html[data-theme] .brow.op+.brow.me{border-top-color:var(--gold);box-shadow:0 -1px 8px var(--glowA)}
html[data-theme] .bl,html[data-theme] .bl.rowpick,html[data-theme] .rsum{color:var(--lab)}
html[data-theme] .bl.rowpick{border-color:var(--gold2)}
html[data-theme] .bl.rowpick.on{background:var(--gold);color:var(--onInk)}
html[data-theme] .board .note{color:var(--dim)}
html[data-theme] .chip.unit,html[data-theme] .tile{border-color:var(--unitEdge);background:var(--panel2)}
html[data-theme] .chip.unit.g,html[data-theme] .tile.g{border-color:var(--gold);box-shadow:0 0 6px var(--glowA),0 2px 4px rgba(0,0,0,.5)}
html[data-theme] .chip.unit.on{box-shadow:0 0 0 2px var(--gold),0 0 12px var(--glowA)}
html[data-theme] .tile .pv,html[data-theme] .tile .bd{background:linear-gradient(180deg,var(--on1),var(--on2));color:var(--onInk);border-color:var(--on2)}
html[data-theme] .tile .pw{border-color:var(--gold)}
html[data-theme] .slot{color:var(--gold);border-color:var(--gold2)}
html[data-theme] .slot:hover,html[data-theme] .slot:focus-visible{background:var(--gold);color:var(--onInk)}
html[data-theme] .brow.drop{background-color:var(--navOn)}
html[data-theme] .log::before{background:linear-gradient(transparent,var(--btnEdge) 10%,var(--btnEdge) 90%,transparent)}
html[data-theme] .log div.me::after,html[data-theme] .log div.op::after{background:var(--btnEdge)}
html[data-theme] .log div.me .le,html[data-theme] .log div.me > span{background:color-mix(in srgb,var(--mine) 26%,var(--panel));color:var(--ink)}
html[data-theme] .log div.op .le,html[data-theme] .log div.op > span{background:color-mix(in srgb,var(--theirs) 26%,var(--panel));color:var(--ink)}
html[data-theme] .flow{box-shadow:inset 0 0 0 1px var(--sheetLine),0 0 0 2px var(--gold),0 0 16px var(--glowA)}
html[data-theme] dialog{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--btnEdge),0 20px 50px rgba(0,0,0,.8)}
html[data-theme] .toast{background:linear-gradient(180deg,var(--on1),var(--on2));color:var(--onInk);border-color:var(--on2)}
html[data-theme] .item{border-color:var(--rule)}
html[data-theme] .cmp select{background:var(--field);border-color:var(--edge);color:var(--ink)}
html[data-theme] .ghost.bad,html[data-theme] .sheet .ghost.bad{border-color:var(--bad)}
html[data-theme] #resBox .kb,html[data-theme] .brow.drop{outline-color:var(--gold)}
/* 极简黑：去掉发光和文字阴影（mini LED 上会产生光晕） */
html[data-theme="black"] *{text-shadow:none!important}
html[data-theme="black"] .chip.unit,html[data-theme="black"] .tile,html[data-theme="black"] .sheet{box-shadow:inset 0 0 0 1px var(--sheetLine)}

/* 外观设置 */
.prefs{display:flex;flex-direction:column;gap:6px}
.prefs select{padding:6px 8px;font-size:13px}
/* 原地修改记录、结束回合、改战力面板 */
.log div.sel .le{outline:2px solid var(--gold);outline-offset:1px}
.log .sheet.flow.inline{margin:4px 0 8px;padding:8px}
.log .sheet.flow.inline .ebtns{display:flex;flex-wrap:wrap;gap:6px}
button.endturn{flex:1;font-weight:600;border-color:var(--gold)}
button.cur{outline:2px solid var(--gold)}
.lab.gl{margin-top:8px}
</style>
