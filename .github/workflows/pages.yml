# main 更新后把 dist/ 发布到 GitHub Pages（根地址跳到 gwent_tracker.html）
name: 发布网页
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 准备网页
        run: |
          mkdir site && cp dist/* site/
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=gwent_tracker.html"><a href="gwent_tracker.html">昆特对局簿</a>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
