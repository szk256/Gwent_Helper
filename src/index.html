<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昆特对局簿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#18202E">
<script>/* 外观：页面画出来之前就套上主题和字号，避免闪一下 */try{var P=JSON.parse(localStorage.getItem("gwent-ui-pref")||"{}");if(P.theme&&P.theme!=="classic")document.documentElement.setAttribute("data-theme",P.theme);if(P.zoom&&P.zoom!=1)document.documentElement.style.zoom=P.zoom;}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header><h1>昆特对局簿</h1><small id="count"></small></header>
<section id="tab-match"></section>
<section id="tab-stats" class="hidden"></section>
<section id="tab-deck" class="hidden"></section>
<section id="tab-coll" class="hidden"></section>
</div>
<nav>
<div class="brand">昆特对局簿</div>
<button data-t="match" class="on">对局</button><button data-t="stats">数据</button><button data-t="deck">卡组</button><button data-t="coll">牌库</button>
<div class="navdata"><div class="navlab">数据迁移</div><button data-do="migAll">全部迁移导出</button><button data-do="impAll">全部导入</button><button data-do="dl">下载备份</button><div class="navlab" id="bkInfo"></div><div class="navlab ver" id="verInfo"></div><div id="prefBox"></div><div class="navlab" id="fanNote"></div></div>
</nav>
<div class="toast" id="toast"></div>
<dialog id="cdlg"><h2 id="cdN"></h2><p class="note" id="cdMeta"></p>
<div class="seg" style="gap:8px"><div style="flex:1"><div class="lab">粮草</div><input id="cdPv" inputmode="numeric"></div><div style="flex:1"><div class="lab">战力</div><input id="cdPw" inputmode="numeric"></div></div>
<div class="row"><div class="lab">效果</div><textarea id="cdTx" style="height:24vh"></textarea></div>
<div class="row"><div class="lab">别名（搜索时也能用，例如简称）</div><input id="cdAl"></div>
<div class="row" id="cdF2row"><div class="lab">也属于阵营（双阵营牌，牌库和组卡时两边都能看到）</div><div class="chips" id="cdF2"></div></div>
<p class="note" id="cdEn" style="white-space:pre-wrap"></p>
<div class="btns"><button class="primary" id="cdOk" style="flex:1">保存修改</button><button class="ghost" id="cdReset">恢复默认</button><button class="ghost" id="cdNo">关闭</button></div></dialog>
<dialog id="dlg"><h2 id="dlgT"></h2><p class="note" id="dlgN"></p><input type="file" id="fileIn" accept=".json,application/json" style="margin-bottom:8px"><button class="ghost hidden" id="dlgPaste" style="margin-bottom:8px">📋 点击粘贴</button><textarea id="dlgX"></textarea>
<div class="btns" style="margin-top:8px"><button class="primary" id="dlgOk" style="flex:1"></button><button class="ghost" id="dlgNo">关闭</button></div></dialog>

<script src="engine.js"></script>
<script src="cards.js"></script>
<script src="data.js"></script>
<script src="patches.js"></script>
<script src="cardflags.js"></script>
<script src="cardids.js"></script>
<script src="codec.js"></script>
<script src="sim.js"></script>
<script src="app.js"></script>
<script src="keys.js"></script>
</body>
</html>
