<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昆特对局簿</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header><h1>昆特对局簿</h1><small id="count"></small></header>
<section id="tab-match"></section>
<section id="tab-stats" class="hidden"></section>
<section id="tab-deck" class="hidden"></section>
<section id="tab-coll" class="hidden"></section>
</div>
<nav>
<button data-t="match" class="on">对局</button><button data-t="stats">数据</button><button data-t="deck">卡组</button><button data-t="coll">牌库</button>
</nav>
<div class="toast" id="toast"></div>
<dialog id="cdlg"><h2 id="cdN"></h2><p class="note" id="cdMeta"></p>
<div class="seg" style="gap:8px"><div style="flex:1"><div class="lab">粮草</div><input id="cdPv" inputmode="numeric"></div><div style="flex:1"><div class="lab">战力</div><input id="cdPw" inputmode="numeric"></div></div>
<div class="row"><div class="lab">效果</div><textarea id="cdTx" style="height:24vh"></textarea></div>
<div class="row"><div class="lab">别名（搜索时也能用，例如简称）</div><input id="cdAl"></div>
<p class="note" id="cdEn" style="white-space:pre-wrap"></p>
<div class="btns"><button class="primary" id="cdOk" style="flex:1">保存修改</button><button class="ghost" id="cdReset">恢复默认</button><button class="ghost" id="cdNo">关闭</button></div></dialog>
<dialog id="dlg"><h2 id="dlgT"></h2><p class="note" id="dlgN"></p><input type="file" id="fileIn" accept=".json,application/json" style="margin-bottom:8px"><textarea id="dlgX"></textarea>
<div class="btns" style="margin-top:8px"><button class="primary" id="dlgOk" style="flex:1"></button><button class="ghost" id="dlgNo">关闭</button></div></dialog>

<script src="engine.js"></script>
<script src="cards.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
